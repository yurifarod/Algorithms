<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Erro</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;

            margin: 0;
        }

        .container {

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 0 15px rgba(0,0,0,0.1);

            text-align: center;

            width: 400px;
        }

        h1 {

            color: #f44336;

            margin-bottom: 20px;
        }

        p {

            color: #555;

            font-size: 18px;

            margin-bottom: 25px;
        }

        a {

            display: inline-block;

            padding: 10px 18px;

            background-color: #2196F3;

            color: white;

            text-decoration: none;

            border-radius: 5px;

            transition: 0.3s;
        }

        a:hover {
            opacity: 0.85;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Erro</h1>

    <p>
        Algum erro aconteceu na sua solicitação.
    </p>

    <a href="/">
        Voltar para Home
    </a>

</div>

</body>
</html>
